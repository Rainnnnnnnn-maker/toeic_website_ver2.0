# sonar-project.properties

sonar.projectKey=Rainnnnnnnn-maker_toeic_website_ver2.0
sonar.organization=rainnnnnnnn-maker

# スキャン対象
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.spec.ts,**/node_modules/**,**/.next/**,**/coverage/**,**/public/**

# テストファイル
sonar.tests=src
sonar.test.inclusions=src/lib/(tests)/**/*.test.ts

# TypeScript
sonar.typescript.tsconfigPath=tsconfig.json

# カバレッジ（手順4実施済み）
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Vitest のカバレッジ対象は src/lib のみ（AGENTS.md: 単体テストは純粋ロジック限定、
# React コンポーネントやページは手動テスト・Cypress で確認する）。
# それ以外をカバレッジ計測から外し、品質ゲートを方針と一致させる（静的解析の対象には残す）。
sonar.coverage.exclusions=src/app/**,src/components/**,src/context/**,src/hooks/**,src/data/**,src/actions/**,src/types/**,src/proxy.ts
