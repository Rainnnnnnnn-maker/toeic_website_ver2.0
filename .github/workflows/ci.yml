name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    environment: Production
    env:
      NEXT_TELEMETRY_DISABLED: 1
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # あえてGemini API Keyを設定しない
      # GEMINI_API_KEY: なし
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint --if-present
      # 型エラー・本番ビルド破壊を CI で検知する（Gemini API Key 無しでも型チェックは通る）
      - run: npm run typecheck --if-present
      - run: npm run test:coverage --if-present
      #- run: npm run build
      # SonarCloud スキャン（自動テストがある場合、lcov.info を生成してからスキャン）
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  #--------------------------------------------------------------------------------------------#
  # nodejs-documentation
  #--------------------------------------------------------------------------------------------#

  nodejs-documentation:
    continue-on-error: true
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "20"
      TYPESCRIPT_SOURCE_DIR: "src"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Generate documentation
        shell: bash
        env:
          TYPESCRIPT_SOURCE_DIR: ${{ env.TYPESCRIPT_SOURCE_DIR }}
        run: |
          set -ex
          npm install typedoc > /dev/null 2>&1
          npx typedoc --entryPointStrategy expand --out docs ${TYPESCRIPT_SOURCE_DIR}

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-documentation-nodejs
          path: docs/
          retention-days: 7

  #--------------------------------------------------------------------------------------------#
  # nodejs-license-check
  #--------------------------------------------------------------------------------------------#

  nodejs-license-check:
    continue-on-error: true
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "20"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: License check
        shell: bash
        run: |
          set -ex
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -yq ruby ruby-dev gem build-essential > /dev/null 2>&1
          sudo gem install license_finder > /dev/null 2>&1

          export THOR_SILENCE_DEPRECATION=1
          license_finder permitted_licenses add MIT
          license_finder permitted_licenses add "Apache-2.0"
          license_finder permitted_licenses add "BSD"
          mkdir -p license_report
          license_finder report --format html > license_report/index.html || true

      - name: Upload license report artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-license-nodejs
          path: license_report/
          retention-days: 7
