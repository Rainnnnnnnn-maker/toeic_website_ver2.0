name: CI

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  push:
    # branches: [main]
    paths-ignore:
      - '**.md'
      - '.gitignore'

jobs:

  #--------------------------------------------------------------------------------------------#
  # nodejs-audit
  #--------------------------------------------------------------------------------------------#

  nodejs-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # 本番依存に high 以上があればCIを落とす（ここは常にクリーンに保つ）
      - name: Audit production dependencies (blocking)
        run: npm audit --audit-level=high --omit=dev

      # dev依存を含む全体。受容済みアドバイザリのみ除外し、それ以外の high 以上は落とす。
      # 除外理由と見直し期限は scripts/check-audit.mjs の ALLOWLIST を参照。
      - name: Audit all dependencies (allowlisted)
        run: npm run audit:ci

  #--------------------------------------------------------------------------------------------#
  # nodejs-linter
  #--------------------------------------------------------------------------------------------#

  nodejs-linter:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  #--------------------------------------------------------------------------------------------#
  # nodejs-typecheck
  #--------------------------------------------------------------------------------------------#

  nodejs-typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 型エラー・本番ビルド破壊を CI で検知する（Gemini API Key 無しでも型チェックは通る）
      - run: npm run typecheck

  #--------------------------------------------------------------------------------------------#
  # nodejs-test-coverage + sonarcloud
  # SonarCloud は lcov.info を必要とするため test:coverage と同じ Job で実行する
  #--------------------------------------------------------------------------------------------#

  nodejs-test-coverage:
    runs-on: ubuntu-latest
    environment: Production
    env:
      NEXT_TELEMETRY_DISABLED: 1
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      # あえてGemini API Keyを設定しない
      # GEMINI_API_KEY: なし

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  #--------------------------------------------------------------------------------------------#
  # nodejs-documentation
  #--------------------------------------------------------------------------------------------#

  nodejs-documentation:
    continue-on-error: true
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "24"
      TYPESCRIPT_SOURCE_DIR: "src"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Generate documentation
        shell: bash
        env:
          TYPESCRIPT_SOURCE_DIR: ${{ env.TYPESCRIPT_SOURCE_DIR }}
        run: |
          set -ex
          npm install typedoc > /dev/null 2>&1
          npx typedoc --entryPointStrategy expand --out docs ${TYPESCRIPT_SOURCE_DIR}

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-documentation-nodejs
          path: docs/
          retention-days: 7

  #--------------------------------------------------------------------------------------------#
  # nodejs-license-check
  #--------------------------------------------------------------------------------------------#

  nodejs-license-check:
    continue-on-error: true
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: License check
        shell: bash
        run: |
          set -ex
          sudo apt-get update > /dev/null 2>&1
          sudo apt-get install -yq ruby ruby-dev gem build-essential > /dev/null 2>&1
          sudo gem install license_finder > /dev/null 2>&1

          export THOR_SILENCE_DEPRECATION=1
          license_finder permitted_licenses add MIT
          license_finder permitted_licenses add "Apache-2.0"
          license_finder permitted_licenses add "BSD"
          mkdir -p license_report
          license_finder report --format html > license_report/index.html || true

      - name: Upload license report artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-license-nodejs
          path: license_report/
          retention-days: 7
